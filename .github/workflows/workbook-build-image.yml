name: Workbook build image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/images/workbook-build/**'
      - '.github/workflows/workbook-build-image.yml'
      - 'requirements-ci.txt'
      - 'requirements-pipeline.txt'
  push:
    branches:
      - main
    paths:
      - '.github/images/workbook-build/**'
      - '.github/workflows/workbook-build-image.yml'
      - 'requirements-ci.txt'
      - 'requirements-pipeline.txt'

permissions:
  contents: read
  packages: write

concurrency:
  group: workbook-build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Compute image content tag
        id: image
        shell: bash
        run: |
          HASH="$(cat .github/images/workbook-build/Dockerfile requirements-ci.txt requirements-pipeline.txt | sha256sum | cut -c1-16)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/single-admission-workbook-build" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -f .github/images/workbook-build/Dockerfile \
            -t "${{ steps.image.outputs.image }}:${{ steps.image.outputs.hash }}" \
            .

      - name: Smoke-test image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            "${{ steps.image.outputs.image }}:${{ steps.image.outputs.hash }}" \
            bash -lc 'python3 -m unittest discover -s tests -v && python3 scripts/check_golden_benchmark.py'

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable and latest tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.image.outputs.image }}"
          HASH="${{ steps.image.outputs.hash }}"
          docker push "$IMAGE:$HASH"
          docker tag "$IMAGE:$HASH" "$IMAGE:latest"
          docker push "$IMAGE:latest"
