name: workbook-qa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XeLaTeX and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Install content schema validator
        run: python -m pip install --requirement requirements-build.txt

      - name: Build student and teacher samples and run QA
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Save PDFs, QA report, and color/grayscale renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbook-qa-${{ github.run_id }}
          path: |
            build/*.pdf
            build/*.log
            build/*.txt
            build/qa-report.json
            build/render/**
          if-no-files-found: warn
          retention-days: 14
