name: A4 baseline v0.3

on:
  workflow_dispatch:
  push:
    branches:
      - design/a4-baseline-v03-source-rebase
    paths:
      - "prototype/a4-baseline-v03/**"
      - "scripts/check_publication_text.py"
      - ".github/workflows/a4-baseline-v03.yml"

permissions:
  contents: read

jobs:
  linux-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX, fonts and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-plain-generic \
            texlive-fonts-recommended \
            fonts-noto-cjk fonts-arphic-gkai00mp fonts-croscore \
            poppler-utils
      - name: Build twice
        working-directory: prototype/a4-baseline-v03
        run: |
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
      - name: Reject obvious layout overflow
        working-directory: prototype/a4-baseline-v03
        run: |
          if grep -E "Overfull \\\\hbox|Overfull \\\\vbox" main.log; then
            echo "Layout overflow detected."
            exit 1
          fi
      - name: Inspect publication output
        working-directory: prototype/a4-baseline-v03
        run: |
          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" = "4"
          pdftotext main.pdf publication.txt
          python ../../scripts/check_publication_text.py publication.txt
          mkdir -p render
          pdftoppm -png -r 120 main.pdf render/page >/dev/null 2>&1
          test -s render/page-1.png
          pdffonts main.pdf
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: a4-baseline-v03-open-fonts
          path: |
            prototype/a4-baseline-v03/main.pdf
            prototype/a4-baseline-v03/render/*.png
          if-no-files-found: error

  windows-font-audit:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Audit reference fonts and TeX availability
        shell: pwsh
        run: |
          $items = @(
            @{ Name = "SimSun"; Path = "C:\Windows\Fonts\simsun.ttc" },
            @{ Name = "SimHei"; Path = "C:\Windows\Fonts\simhei.ttf" },
            @{ Name = "KaiTi"; Path = "C:\Windows\Fonts\simkai.ttf" },
            @{ Name = "Times New Roman"; Path = "C:\Windows\Fonts\times.ttf" }
          )
          foreach ($item in $items) {
            $exists = Test-Path $item.Path
            "$($item.Name): $exists ($($item.Path))" | Tee-Object -FilePath font-audit.txt -Append
          }
          $xelatex = Get-Command xelatex -ErrorAction SilentlyContinue
          "xelatex: $([bool]$xelatex)" | Tee-Object -FilePath font-audit.txt -Append
          Get-Content font-audit.txt
      - name: Upload font audit
        uses: actions/upload-artifact@v4
        with:
          name: windows-publish-font-audit
          path: font-audit.txt
