name: Content contract

on:
  workflow_dispatch:
  push:
    branches:
      - foundation/content-model-v01
      - ingest/probe-v01
    paths:
      - "schema/**"
      - "examples/**"
      - "engine/**"
      - "tests/**"
      - "content/quotes.yaml"
      - "scripts/validate_content.py"
      - "requirements-ci.txt"
      - ".github/workflows/content-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: pip install -r requirements-ci.txt
      - name: Validate canonical content contract
        run: python scripts/validate_content.py
      - name: Run ingestion unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
